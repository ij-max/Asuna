<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Be My Val?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Hey My Queen,</h1>
      <p>I've been meaning to ask you something really important.</p>
     
      <p>So, I have one question for you...</p>
      <button id="reveal-button" onclick="revealQuestion()">
        Click here to find out
      </button>
      <div id="question" class="hidden">
        <h2>Will you be my Val?</h2>
        <button onclick="showResponse('yes')">Yes</button>
        <button onclick="showResponse('no')">No</button>
      </div>
      <div id="response" class="hidden"></div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
